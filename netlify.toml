# ==========================================
# PPAI Preventera - Netlify Configuration
# Repository: github.com/Preventera/ppai-sante-securite-quebec
# ==========================================

[build]
  # Build principal pour production (main branch)
  publish = "dist"
  command = "npm run build"
  functions = "functions"

# ==========================================
# DÉVELOPPEMENT (develop branch)
# ==========================================
[context.develop.build]
  command = "npm run build:dev"
  publish = "dist"

[context.develop.environment]
  VITE_APP_ENV = "development"
  VITE_API_URL = "https://ppai-dev.supabase.co"
  VITE_SUPABASE_URL = "https://ppai-dev.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dev..."
  VITE_AI_ENGINE_URL = "https://api.anthropic.com/v1"
  VITE_CNESST_MODE = "sandbox"
  VITE_DEMO_MODE = "true"
  VITE_DEBUG_ENABLED = "true"
  VITE_VERSION = "dev-{{COMMIT_REF}}"

# ==========================================
# STAGING CNESST (staging-cnesst branch)
# ==========================================
[context.staging-cnesst.build]
  command = "npm run build:staging"
  publish = "dist"

[context.staging-cnesst.environment]
  VITE_APP_ENV = "staging"
  VITE_API_URL = "https://ppai-staging.supabase.co"
  VITE_SUPABASE_URL = "https://ppai-staging.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.staging..."
  VITE_AI_ENGINE_URL = "https://api.anthropic.com/v1"
  VITE_CNESST_MODE = "validation"
  VITE_DEMO_MODE = "false"
  VITE_DEBUG_ENABLED = "false"
  VITE_VERSION = "staging-{{COMMIT_REF}}"

# ==========================================
# PRODUCTION (main branch)
# ==========================================
[context.production.environment]
  VITE_APP_ENV = "production"
  VITE_API_URL = "https://ppai-prod.supabase.co"
  VITE_SUPABASE_URL = "https://ppai-prod.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.prod..."
  VITE_AI_ENGINE_URL = "https://api.anthropic.com/v1"
  VITE_CNESST_MODE = "live"
  VITE_DEMO_MODE = "false"
  VITE_DEBUG_ENABLED = "false"
  VITE_VERSION = "{{COMMIT_REF}}"

# ==========================================
# DEPLOY PREVIEWS (Pull Requests)
# ==========================================
[context.deploy-preview.build]
  command = "npm run build:preview"

[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"
  VITE_API_URL = "https://ppai-dev.supabase.co"
  VITE_SUPABASE_URL = "https://ppai-dev.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dev..."
  VITE_AI_ENGINE_URL = "https://api.anthropic.com/v1"
  VITE_CNESST_MODE = "sandbox"
  VITE_DEMO_MODE = "true"
  VITE_DEBUG_ENABLED = "true"
  VITE_VERSION = "preview-{{COMMIT_REF}}"

# ==========================================
# REDIRECTS - SCÉNARIOS DÉMO PPAI
# ==========================================
[[redirects]]
  from = "/demo/construction"
  to = "/scenarios/construction-prevention"
  status = 200

[[redirects]]
  from = "/demo/elaboration"  
  to = "/scenarios/metal-fabrication"
  status = 200

[[redirects]]
  from = "/demo/coss"
  to = "/scenarios/safety-committee"
  status = 200

[[redirects]]
  from = "/demo/inspection"
  to = "/scenarios/mobile-inspection"
  status = 200

[[redirects]]
  from = "/demo/ai-agent"
  to = "/orchestrator/autonomous-agent"
  status = 200

# API Proxy pour éviter CORS
[[redirects]]
  from = "/api/*"
  to = "{{VITE_API_URL}}/:splat"
  status = 200
  force = true

# ==========================================
# HEADERS - SÉCURITÉ PPAI
# ==========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' https://*.supabase.co https://api.anthropic.com;
    """

# Headers développement
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
  [headers.environment]
    VITE_APP_ENV = "development"

# ==========================================
# EDGE FUNCTIONS PPAI
# ==========================================
[[edge_functions]]
  function = "ai-orchestrator"
  path = "/api/orchestrator/*"

[[edge_functions]]
  function = "risk-analyzer"
  path = "/api/analyze-risk"

[[edge_functions]]
  function = "cnesst-validator"
  path = "/api/validate-cnesst"

# ==========================================
# BUILD PLUGINS
# ==========================================
[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[plugins]]
  package = "netlify-plugin-bundle-analyzer"

# ==========================================
# FONCTIONS SERVERLESS
# ==========================================
[functions]
  directory = "functions"
  node_bundler = "esbuild"

# ==========================================
# OPTIMISATION BUILD
# ==========================================
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true