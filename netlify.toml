# ==========================================
# PPAI Preventera — Configuration Netlify
# Repository: github.com/Preventera/ppai-sante-securite-quebec
#
# Principe : le site doit se déployer et fonctionner sans backend.
# Sans variables Supabase, l'application bascule d'elle-même en mode
# démonstration (registre pré-chargé, générateur local). Renseigner les
# variables dans l'interface Netlify suffit à passer en mode « live ».
#
# Les secrets ne sont PAS versionnés ici : Netlify > Site configuration >
# Environment variables. Tout ce qui est préfixé VITE_ finit dans le bundle
# public — n'y placer que la clé « anon » de Supabase, jamais la clé service.
# ==========================================

[build]
  publish = "dist"
  command = "npm run build"

# ==========================================
# DÉVELOPPEMENT (branche develop)
# ==========================================
[context.develop.build]
  command = "npm run build:dev"
  publish = "dist"

[context.develop.environment]
  VITE_APP_ENV = "development"
  VITE_DEMO_MODE = "true"
  VITE_VERSION = "dev-{{COMMIT_REF}}"

# ==========================================
# STAGING CNESST (branche staging-cnesst)
# ==========================================
[context.staging-cnesst.build]
  command = "npm run build:staging"
  publish = "dist"

[context.staging-cnesst.environment]
  VITE_APP_ENV = "staging"
  VITE_DEMO_MODE = "true"
  VITE_VERSION = "staging-{{COMMIT_REF}}"

# ==========================================
# PRODUCTION (branche main)
#
# VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY se définissent dans
# l'interface Netlify. Tant qu'elles sont absentes, le site tourne en
# mode démonstration plutôt que d'afficher une page en erreur.
# ==========================================
[context.production.environment]
  VITE_APP_ENV = "production"
  VITE_VERSION = "{{COMMIT_REF}}"

# ==========================================
# APERÇUS DE PULL REQUEST
# ==========================================
[context.deploy-preview.build]
  command = "npm run build:preview"
  publish = "dist"

[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"
  VITE_DEMO_MODE = "true"
  VITE_VERSION = "preview-{{COMMIT_REF}}"

# ==========================================
# BRANCHES DE TRAVAIL
# ==========================================
[context.branch-deploy.environment]
  VITE_APP_ENV = "branch"
  VITE_DEMO_MODE = "true"
  VITE_VERSION = "branch-{{COMMIT_REF}}"

# ==========================================
# REDIRECTIONS
#
# L'application est une SPA React Router : sans ce repli, toute URL
# profonde (/risks, /programs, /kpi-generator) renvoie 404 au
# rechargement ou en accès direct. Cette règle doit rester la dernière.
# ==========================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==========================================
# EN-TÊTES DE SÉCURITÉ
#
# connect-src autorise Supabase (base et Edge Functions). L'API Anthropic
# n'est jamais appelée depuis le navigateur : la clé reste côté serveur,
# dans les secrets de l'Edge Function.
# ==========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Les fichiers versionnés par empreinte peuvent être mis en cache durablement.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
